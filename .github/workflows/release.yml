name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - integration

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.head_ref, 'release/')

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create venv and install
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin pytest
          .venv/bin/maturin develop --features pyo3/extension-module

      - name: Run tests
        run: .venv/bin/pytest tests/ -v

  # ── Linux ────────────────────────────────────────────────────────────────
  # Built inside a manylinux_2_28 container (PyO3/maturin-action) so the
  # resulting wheel is installable on glibc>=2.28. Covers Debian 11
  # (bullseye, glibc 2.31, used by python:3.11-slim-bullseye), Debian 12,
  # Ubuntu 20.04+, and most enterprise distros. Earlier rsty releases
  # produced manylinux_2_34 wheels which don't install on Debian 11.
  build-linux:
    name: Build linux py${{ matrix.python }}
    needs: test
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-unknown-linux-gnu
          manylinux: 2_28
          # native-tls-vendored compiles OpenSSL from source via openssl-src,
          # which uses OpenSSL's perl-based Configure script. The minimal
          # manylinux_2_28 container ships Perl without IPC::Cmd, so install
          # it before maturin runs.
          before-script-linux: |
            dnf install -y perl-IPC-Cmd
          args: --release --interpreter python${{ matrix.python }} --features pyo3/extension-module --out dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-py${{ matrix.python }}
          path: dist/*.whl

  # ── macOS ────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macos ${{ matrix.target }} py${{ matrix.python }}
    needs: test
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          targets: ${{ matrix.target }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        run: |
          pip install maturin
          maturin build --release \
            --target ${{ matrix.target }} \
            --interpreter python${{ matrix.python }} \
            --features pyo3/extension-module \
            --out dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-${{ matrix.target }}-py${{ matrix.python }}
          path: dist/*.whl

  # ── Windows ──────────────────────────────────────────────────────────────
  build-windows:
    name: Build windows py${{ matrix.python }}
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          targets: x86_64-pc-windows-msvc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        run: |
          pip install maturin
          maturin build --release `
            --target x86_64-pc-windows-msvc `
            --interpreter python${{ matrix.python }} `
            --features pyo3/extension-module `
            --out dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-py${{ matrix.python }}
          path: dist/*.whl

  release:
    name: GitHub Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Extract version from PR head branch
        id: version
        run: |
          BRANCH="${{ github.head_ref }}"
          VERSION="${BRANCH#release/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: List wheels
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: dist/*
          generate_release_notes: true

      # Publish to PyPI
      - name: Publish to PyPI
        if: vars.PUBLISH_TO_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist/
