name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - integration

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.head_ref, 'release/')

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create venv and install
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin pytest
          .venv/bin/maturin develop --features pyo3/extension-module

      - name: Run tests
        run: .venv/bin/pytest tests/ -v

  build-and-release:
    name: Build & GitHub Release
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install maturin
        run: pip install maturin

      - name: Extract version from PR head branch
        id: version
        run: |
          BRANCH="${{ github.head_ref }}"
          VERSION="${BRANCH#release/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build wheel (release)
        run: maturin build --release --features pyo3/extension-module

      - name: List dist/
        run: ls -lh target/wheels/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: v${{ steps.version.outputs.tag }}
          files: target/wheels/*
          generate_release_notes: true

      # Publish to PyPI via maturin — gated by PUBLISH_TO_PYPI variable
      - name: Publish to PyPI
        if: vars.PUBLISH_TO_PYPI == 'true'
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: maturin publish --features pyo3/extension-module
