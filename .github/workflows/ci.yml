name: CI

on:
  push:
    branches:
      - "feat/**"
      - "bug/**"
      - "claude/**"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - staging
      - integration

jobs:
  # ── Auto-label and assign on PR open ────────────────────────────────────────
  auto-label:
    name: Label & Assign PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'opened'

    permissions:
      pull-requests: write

    steps:
      - name: Apply label and assignee
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          BRANCH="${{ github.head_ref }}"
          AUTHOR="${{ github.event.pull_request.user.login }}"

          gh pr edit "$PR" --repo "${{ github.repository }}" --add-assignee "$AUTHOR"

          if echo "$BRANCH" | grep -qE '^feat/'; then
            LABEL="feature"; COLOR="0075ca"
          elif echo "$BRANCH" | grep -qE '^bug/'; then
            LABEL="bugfix"; COLOR="d73a4a"
          elif echo "$BRANCH" | grep -qE '^docs/'; then
            LABEL="documentation"; COLOR="006b75"
          else
            LABEL="feature"; COLOR="0075ca"
          fi

          gh label create "$LABEL" --color "$COLOR" --force --repo "${{ github.repository }}" 2>/dev/null || true
          gh pr edit "$PR" --repo "${{ github.repository }}" --add-label "$LABEL"

  # ── Rust Check ─────────────────────────────────────────────────────────────
  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: cargo check --features pyo3/extension-module

  # ── Build + Test ───────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create venv and install tools
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin pytest

      - name: Build and install (dev)
        run: .venv/bin/maturin develop --features pyo3/extension-module

      - name: Run tests
        run: .venv/bin/pytest tests/ -v

  # ── Smoke Test (wheel install) ─────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheel
        run: |
          pip install maturin
          maturin build --release --features pyo3/extension-module

      - name: Install wheel and smoke test
        run: |
          python -m venv .smoke-venv
          .smoke-venv/bin/pip install target/wheels/cutip_blocks-*.whl
          .smoke-venv/bin/python -c "
          from cutip_blocks import ssh, kubectl, container, file, http
          from cutip_blocks import validate, config, network, service
          from cutip_blocks.blocks import ssh as ssh_compat
          from cutip_blocks.utils import is_empty
          assert is_empty(None) == True
          assert is_empty('hello') == False
          print('OK: all modules importable, is_empty works')
          "

  # ── Docs Build ──────────────────────────────────────────────────────────────
  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install docs dependencies
        run: |
          uv venv .venv
          uv pip install mkdocs-material "mkdocs<2.0" mkdocs-callouts

      - name: Build docs (strict)
        run: uv run mkdocs build --strict
