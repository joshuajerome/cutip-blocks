[package]
name = "rsty_core"
version = "0.7.3"
edition = "2021"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
russh = "0.60"
russh-sftp = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "fs", "io-util"] }
async-trait = "0.1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
bollard = "0.18"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "native-tls"], default-features = false }
walkdir = "2"
tar = "0.4"
flate2 = "1"
regex = "1"
rsa = { version = "0.9", features = ["sha2"] }
notify-rust = "4"
