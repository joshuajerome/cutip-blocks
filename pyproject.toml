[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "cutip-blocks"
version = "0.3.6"
description = "Reusable workflow blocks for CUTIP — Rust-backed via PyO3"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Joshua Jerome" },
]
keywords = ["cutip", "containers", "workflow", "blocks", "kubernetes", "ssh", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
]
requires-python = ">=3.11"
# No Python dependencies — all I/O is Rust (russh, bollard, reqwest, serde)

[project.urls]
Homepage = "https://github.com/joshuajerome/cutip-blocks"
Repository = "https://github.com/joshuajerome/cutip-blocks"
"Bug Tracker" = "https://github.com/joshuajerome/cutip-blocks/issues"

[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs<2.0",
    "mkdocs-callouts>=1.14",
]

[dependency-groups]
dev = [
    "maturin>=1.0",
    "pytest>=9.0",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "cutip_blocks._core"
python-source = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
