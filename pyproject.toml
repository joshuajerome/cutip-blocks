[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rsty"
version = "0.10.1"
description = "Python-typed Rust modules for workflow automation — SSH, containers, files, HTTP, packages, services, templates"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Joshua Jerome" },
]
keywords = ["cutip", "rust", "pyo3", "workflow", "automation", "ssh", "containers", "kubernetes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.11"
# No Python dependencies — all I/O is Rust (russh, bollard, reqwest, serde)

[project.urls]
Homepage = "https://github.com/joshuajerome/rsty"
Repository = "https://github.com/joshuajerome/rsty"
"Bug Tracker" = "https://github.com/joshuajerome/rsty/issues"

[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs<2.0",
    "mkdocs-callouts>=1.14",
]

[dependency-groups]
dev = [
    "maturin>=1.0",
    "pytest>=9.0",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "rsty._core"
python-source = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
