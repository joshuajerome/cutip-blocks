[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cutip-blocks"
version = "0.2.0"
description = "Reusable workflow blocks for CUTIP — container, SSH, k8s, file, and more"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Joshua Jerome" },
]
keywords = ["cutip", "containers", "workflow", "blocks", "kubernetes", "ssh"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
    "cutip>=0.2.0",
    "loguru>=0.7",
    "paramiko>=3.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/joshuajerome/cutip-blocks"
Repository = "https://github.com/joshuajerome/cutip-blocks"
"Bug Tracker" = "https://github.com/joshuajerome/cutip-blocks/issues"

[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs<2.0",
    "mkdocs-callouts>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.11",
    "ty>=0.0.1a7",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "B904", "SIM105", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["cutip_blocks"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.rules]
unresolved-import = "warn"
not-iterable = "warn"
unresolved-attribute = "warn"
invalid-return-type = "warn"
no-matching-overload = "warn"
invalid-argument-type = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
